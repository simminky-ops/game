<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>나이트 윙</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { box-shadow: 0 0 40px #ff6a3d55; touch-action: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="800" height="450"></canvas></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = H - 40;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  if ((e.code === 'KeyM' || e.code === 'Escape') && state !== 'play') { location.href = 'index.html'; return; }
  if (e.code === 'Enter' && state !== 'play') start();
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' && state === 'play') releaseCharge();
  if (e.code === 'Space' && state !== 'play' && !justStarted) start();
});
let justStarted = false;

let touch = null;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { start(); return; }
  const p = toCanvas(e);
  touch = { x: p.x, y: p.y, px: player.x, py: player.y, t: Date.now() };
  touchCharge = true;
});
cv.addEventListener('pointermove', e => {
  if (!touch) return;
  const p = toCanvas(e);
  player.x = clamp(touch.px + (p.x - touch.x), 20, W - 40);
  player.y = clamp(touch.py + (p.y - touch.y), 20, GROUND - 16);
});
addEventListener('pointerup', () => {
  if (touch && state === 'play') releaseCharge();
  touch = null; touchCharge = false;
});
let touchCharge = false;

// ---------- 사운드 ----------
let actx = null;
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

// ---------- 유틸 ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const hit = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r;
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// ---------- 배경 (패럴랙스) ----------
function makeLayer(n, minH, maxH, w) {
  const arr = []; let x = 0;
  while (x < W + 400) { const ww = rand(w * 0.6, w * 1.4); arr.push({ x, w: ww, h: rand(minH, maxH) }); x += ww; }
  return arr;
}
const mountains = makeLayer(0, 60, 150, 160);
const city = makeLayer(0, 30, 110, 40);
for (const b of city) b.lights = Array.from({ length: Math.floor(b.h / 14) }, () => Math.random() < 0.4);
let scrollM = 0, scrollC = 0, scrollG = 0;

// ---------- 게임 상태 ----------
let state = 'title', paused = false;
let player = null, bullets = [], eBullets = [], enemies = [], items = [], parts = [], lasers = [];
let score = 0, best = +(localStorageGet('side_best') || 0);
let frame = 0, stage = 1, stageTimer = 0, bossActive = false, shake = 0, stageMsg = 0;

function start() {
  player = { x: 120, y: H / 2, r: 9, lives: 3, power: 1, cool: 0, inv: 60, charge: 0 };
  bullets = []; eBullets = []; enemies = []; items = []; parts = []; lasers = [];
  score = 0; frame = 0; stage = 1; stageTimer = 0; bossActive = false; shake = 0; paused = false;
  stageMsg = 75;
  state = 'play';
  justStarted = true; setTimeout(() => justStarted = false, 300);
  beep(330, 0.2, 'triangle', 0.08, 330);
}

const CHARGE_MAX = 30; // 30프레임 = 1초
function releaseCharge() {
  if (!player) return;
  if (player.charge >= CHARGE_MAX) {
    lasers.push({ y: player.y, x: player.x + 20, life: 12, hitSet: new Set() });
    shake = 6;
    beep(120, 0.5, 'sawtooth', 0.1, 400);
  }
  player.charge = 0;
}

// ---------- 적 ----------
function spawnEnemy() {
  const t = Math.random(), lv = stage;
  if (t < 0.4) {
    enemies.push({ type: 'dart', x: W + 30, y: rand(30, GROUND - 40), vx: -(2.5 + lv * 0.3), vy: 0, r: 14, hp: 1 + Math.floor(lv / 3), score: 100, t: 0, col: '#ff7b54' });
  } else if (t < 0.7) {
    const baseY = rand(80, GROUND - 100);
    for (let i = 0; i < 4; i++)
      enemies.push({ type: 'sine', x: W + 30 + i * 40, y: baseY, baseY, vx: -2, r: 13, hp: 1 + Math.floor(lv / 2), score: 120, t: -i * 8, col: '#ffd166' });
  } else if (t < 0.88) {
    enemies.push({ type: 'turret', x: W + 30, y: GROUND - 14, vx: -1.5, r: 16, hp: 5 + lv * 2, score: 300, t: 0, col: '#9b5de5' });
  } else {
    enemies.push({ type: 'heavy', x: W + 50, y: rand(60, GROUND - 80), vx: -1, r: 26, hp: 14 + lv * 4, score: 500, t: 0, col: '#f15bb5' });
  }
}

function spawnBoss() {
  bossActive = true;
  const hp = 220 + stage * 120;
  enemies.push({ type: 'boss', boss: true, x: W + 140, y: H / 2 - 30, vx: -1.2, r: 60, hp, maxHp: hp, score: 6000, t: 0, col: '#ef476f' });
  beep(90, 1, 'sawtooth', 0.1, 60);
}

function aimShot(e, speed, spread = 0) {
  const a = Math.atan2(player.y - e.y, player.x - e.x) + spread;
  eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
}
function fanShot(e, n, speed, center, width) {
  for (let i = 0; i < n; i++) {
    const a = center - width / 2 + width * i / (n - 1);
    eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
  }
}

function damage(e, d) {
  if (e.dead) return;
  e.hp -= d; e.flash = 3;
  if (e.hp > 0) return;
  e.dead = true;
  score += e.score;
  explode(e.x, e.y, e.boss ? 90 : e.r * 1.5, e.col);
  shake = Math.max(shake, e.boss ? 25 : e.type === 'heavy' ? 8 : 3);
  beep(e.boss ? 60 : 160, e.boss ? 1.2 : 0.25, 'sawtooth', 0.08, -100);
  if (e.boss) {
    items.push({ x: e.x, y: e.y - 20, t: 'P', r: 12 });
    items.push({ x: e.x, y: e.y + 20, t: 'L', r: 12 });
    bossActive = false; stage++; stageTimer = 0; stageMsg = 90; eBullets = [];
  } else if (e.type === 'heavy' || e.type === 'turret' || Math.random() < 0.06) {
    items.push({ x: e.x, y: Math.min(e.y, GROUND - 30), t: Math.random() < 0.85 ? 'P' : 'L', r: 12 });
  }
}

function explode(x, y, n, c) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, 6);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(12, 28), c: Math.random() < 0.5 ? c : '#ffe5a0' });
  }
}

// ---------- 업데이트 ----------
function update() {
  frame++;
  const spd = state === 'play' && !paused ? 1 : 0.3;
  scrollM = (scrollM + 0.4 * spd); scrollC = (scrollC + 1.2 * spd); scrollG = (scrollG + 3 * spd) % 40;
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy *= 0.93; p.life--; }
  parts = parts.filter(p => p.life > 0);
  if (state !== 'play' || paused) return;

  if (stageMsg > 0) stageMsg--;
  if (shake > 0) shake--;
  stageTimer++;

  // 이동
  const sp = 4;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx--;
  if (keys.ArrowRight || keys.KeyD) dx++;
  if (keys.ArrowUp || keys.KeyW) dy--;
  if (keys.ArrowDown || keys.KeyS) dy++;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  player.x = clamp(player.x + dx * sp, 20, W - 40);
  player.y = clamp(player.y + dy * sp, 20, GROUND - 16);
  if (player.inv > 0) player.inv--;

  // 차지 (Space / 터치 꾹)
  const charging = keys.Space || touchCharge;
  if (charging) { player.charge = Math.min(CHARGE_MAX, player.charge + 1); if (player.charge === CHARGE_MAX && frame % 6 === 0) beep(1200, 0.03, 'sine', 0.02); }

  // 자동 발사 (차지 중엔 약하게)
  if (player.cool-- <= 0) {
    player.cool = charging ? 6 : 3;
    const p = player.power;
    const shoot = (oy, vy) => bullets.push({ x: player.x + 18, y: player.y + oy, vx: 12, vy, r: 4 });
    shoot(0, 0);
    if (p >= 2) { shoot(-7, 0); shoot(7, 0); }
    if (p >= 3) { shoot(-10, -1.5); shoot(10, 1.5); }
    if (p >= 4) { shoot(-12, -3); shoot(12, 3); }
    if (frame % 6 === 0) beep(800, 0.03, 'square', 0.012);
  }

  // 레이저
  for (const L of lasers) {
    L.y = player.y; L.x = player.x + 20; L.life--;
    for (const e of enemies) if (!L.hitSet.has(e) && e.x > L.x && Math.abs(e.y - L.y) < e.r + 12) { L.hitSet.add(e); damage(e, 25); }
    eBullets = eBullets.filter(b => !(b.x > L.x && Math.abs(b.y - L.y) < 14));
  }
  lasers = lasers.filter(L => L.life > 0);

  // 적 생성
  if (!bossActive) {
    const rate = Math.max(14, 34 - stage * 3);
    if (stageTimer % rate === 0) spawnEnemy();
    if (stageTimer === 900) spawnBoss(); // 30fps 기준 30초
  }

  // 적 행동
  for (const e of enemies) {
    e.t++;
    if (e.flash) e.flash--;
    if (e.type === 'dart') {
      e.x += e.vx;
      if (e.t === 25 && Math.random() < 0.5) aimShot(e, 3.5);
    } else if (e.type === 'sine') {
      e.x += e.vx; e.y = e.baseY + Math.sin(e.t / 8) * 50;
      if (e.t === 40 && Math.random() < 0.4) aimShot(e, 3.2);
    } else if (e.type === 'turret') {
      e.x += e.vx;
      if (e.t % 35 === 15) { aimShot(e, 3.6); aimShot(e, 3.6, 0.15); }
    } else if (e.type === 'heavy') {
      e.x += e.x > W - 160 ? e.vx * 1.5 : e.vx * 0.3;
      if (e.t % 40 === 20) fanShot(e, 5 + stage, 3, Math.PI, 1.2);
    } else if (e.type === 'boss') {
      if (e.x > W - 150) e.x += e.vx;
      else {
        e.y = H / 2 - 30 + Math.sin(e.t / 30) * 110;
        const phase = e.hp < e.maxHp / 2;
        if (e.t % (phase ? 4 : 6) === 0) {
          const a = Math.PI + Math.sin(e.t / 10) * 0.9;
          eBullets.push({ x: e.x - 40, y: e.y, vx: Math.cos(a) * 3.5, vy: Math.sin(a) * 3.5, r: 5 });
        }
        if (e.t % 45 === 0) fanShot(e, phase ? 13 : 9, 3, Math.PI, 2.2);
        if (e.t % 30 === 15) { aimShot(e, 5); aimShot(e, 5, 0.12); aimShot(e, 5, -0.12); }
      }
    }
  }

  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  for (const b of eBullets) { b.x += b.vx; b.y += b.vy; }
  for (const it of items) { it.x -= 1.5; it.y += Math.sin((frame + it.x) / 10) * 0.8; }

  // 충돌
  for (const b of bullets) for (const e of enemies)
    if (!e.dead && !b.used && e.x < W + 10 && hit(b, e)) { b.used = true; damage(e, 1); parts.push({ x: b.x, y: b.y, vx: rand(-1, 1), vy: rand(-1, 1), life: 5, c: '#fff' }); }

  if (player.inv <= 0) {
    for (const b of eBullets) if (hit(b, player)) { b.used = true; playerHit(); break; }
    for (const e of enemies) if (!e.dead && player.inv <= 0 && hit(player, e)) { if (!e.boss) damage(e, 999); playerHit(); }
  }

  for (const it of items) if (Math.hypot(it.x - player.x, it.y - player.y) < it.r + 22) {
    it.used = true;
    if (it.t === 'P') { if (player.power < 4) player.power++; else score += 1000; }
    if (it.t === 'L') player.lives = Math.min(5, player.lives + 1);
    beep(660, 0.2, 'triangle', 0.08, 600);
  }

  bullets = bullets.filter(b => !b.used && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  eBullets = eBullets.filter(b => !b.used && b.x > -20 && b.x < W + 40 && b.y > -20 && b.y < H + 20);
  enemies = enemies.filter(e => !e.dead && e.x > -80);
  items = items.filter(it => !it.used && it.x > -20);
}

function playerHit() {
  player.lives--;
  player.power = Math.max(1, player.power - 1);
  player.inv = 75; player.charge = 0;
  eBullets = []; shake = 12;
  explode(player.x, player.y, 50, '#7df9ff');
  beep(200, 0.5, 'sawtooth', 0.1, -150);
  if (player.lives <= 0) {
    state = 'over';
    if (score > best) { best = score; localStorageSet('side_best', best); }
  }
}

// ---------- 그리기 ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a0b2e'); g.addColorStop(0.55, '#7a2a5a'); g.addColorStop(1, '#ff8c5a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 해
  ctx.fillStyle = '#ffcf7a'; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.arc(W * 0.7, GROUND - 110, 70, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // 산
  ctx.fillStyle = '#3d1846';
  drawLayer(mountains, scrollM, (b, x) => { ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + b.w / 2, GROUND - b.h); ctx.lineTo(x + b.w, GROUND); ctx.fill(); });
  // 도시
  drawLayer(city, scrollC, (b, x) => {
    ctx.fillStyle = '#1c0d26'; ctx.fillRect(x, GROUND - b.h, b.w - 3, b.h);
    ctx.fillStyle = '#ffd36e';
    b.lights.forEach((on, i) => { if (on) ctx.fillRect(x + 6, GROUND - b.h + 6 + i * 14, 4, 4); });
  });
  // 땅
  ctx.fillStyle = '#12081a'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#ff6a3d88'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
  ctx.strokeStyle = '#ff6a3d33'; ctx.lineWidth = 1;
  for (let x = -scrollG; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x - 30, H); ctx.stroke(); }
}
function drawLayer(arr, scroll, fn) {
  const total = arr[arr.length - 1].x + arr[arr.length - 1].w;
  const off = scroll % total;
  for (const b of arr) {
    let x = b.x - off;
    if (x + b.w < 0) x += total;
    if (x < W) fn(b, x);
    if (x + total < W) fn(b, x + total);
  }
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(player.inv / 3) % 2) return;
  const { x, y } = player;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = `hsl(${20 + Math.random() * 30},100%,60%)`;
  ctx.beginPath(); ctx.moveTo(-16, -4); ctx.lineTo(-26 - Math.random() * 10, 0); ctx.lineTo(-16, 4); ctx.fill();
  ctx.fillStyle = '#2a9d8f';
  ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-14, -16); ctx.lineTo(-8, -16); ctx.lineTo(6, 0); ctx.lineTo(-8, 16); ctx.lineTo(-14, 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e9f5f2';
  ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(4, -6); ctx.lineTo(-16, -5); ctx.lineTo(-16, 5); ctx.lineTo(4, 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7df9ff'; ctx.beginPath(); ctx.ellipse(6, -2, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a9d8f'; ctx.fillRect(-16, -12, 4, 8);
  ctx.restore();
  // 차지 게이지
  if (player.charge > 0) {
    const full = player.charge >= CHARGE_MAX;
    ctx.strokeStyle = full ? `hsl(${frame * 20 % 360},100%,70%)` : '#7df9ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x + 26, y, 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.charge / CHARGE_MAX); ctx.stroke();
  }
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = e.flash ? '#fff' : e.col;
  if (e.type === 'dart') {
    ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(10, -12); ctx.lineTo(4, 0); ctx.lineTo(10, 12); ctx.closePath(); ctx.fill();
  } else if (e.type === 'sine') {
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a2a00'; ctx.beginPath(); ctx.arc(-4, 0, 4, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'turret') {
    ctx.fillRect(-16, -2, 32, 16);
    ctx.beginPath(); ctx.arc(0, -2, 11, Math.PI, 0); ctx.fill();
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.strokeStyle = e.flash ? '#fff' : '#d0b0ff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(Math.cos(a) * 18, -4 + Math.sin(a) * 18); ctx.stroke();
  } else if (e.type === 'heavy') {
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-10, -22); ctx.lineTo(26, -16); ctx.lineTo(26, 16); ctx.lineTo(-10, 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = e.flash ? '#fff' : '#6b1f50'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'boss') {
    // 거대 비행선
    ctx.beginPath(); ctx.ellipse(0, 0, 90, 38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.flash ? '#fff' : '#8c1c3c';
    ctx.fillRect(-40, 30, 80, 18);
    ctx.beginPath(); ctx.moveTo(70, -10); ctx.lineTo(110, -45); ctx.lineTo(115, -10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(70, 10); ctx.lineTo(110, 45); ctx.lineTo(115, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `hsl(${frame * 8 % 360},100%,65%)`;
    ctx.beginPath(); ctx.arc(-50, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd36e';
    for (let i = -2; i <= 2; i++) ctx.fillRect(i * 16 - 3, 36, 6, 6);
  }
  ctx.restore();
}

function center(txt, y, size, col = '#fff') {
  ctx.fillStyle = col; ctx.font = `bold ${size}px "Segoe UI", "Malgun Gothic"`; ctx.textAlign = 'center';
  ctx.fillText(txt, W / 2, y);
}

function hud() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px "Segoe UI", "Malgun Gothic"'; ctx.textAlign = 'left';
  ctx.fillText('점수 ' + score.toLocaleString(), 12, 24);
  ctx.textAlign = 'right'; ctx.fillText('최고 ' + Math.max(best, score).toLocaleString(), W - 12, 24);
  ctx.font = '14px "Segoe UI", "Malgun Gothic"';
  ctx.textAlign = 'left'; ctx.fillStyle = '#7df9ff'; ctx.fillText('♥'.repeat(player.lives) + '   파워 ' + player.power, 12, H - 14);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffd36e'; ctx.fillText('STAGE ' + stage, W - 12, H - 14);
  const boss = enemies.find(e => e.boss);
  if (boss) {
    ctx.fillStyle = '#300'; ctx.fillRect(200, 36, W - 400, 8);
    ctx.fillStyle = '#ef476f'; ctx.fillRect(200, 36, (W - 400) * Math.max(0, boss.hp) / boss.maxHp, 8);
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) / 3, rand(-shake, shake) / 3);
  drawBackground();
  if (state !== 'title') {
    for (const it of items) {
      ctx.fillStyle = it.t === 'P' ? '#ff6b6b' : '#69f0ae';
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(it.t, it.x, it.y + 5);
    }
    for (const e of enemies) drawEnemy(e);
    ctx.fillStyle = '#fff3b0';
    for (const b of bullets) ctx.fillRect(b.x - 7, b.y - 1.5, 14, 3);
    for (const L of lasers) {
      const w = 10 + L.life * 1.5;
      ctx.fillStyle = `rgba(125,249,255,${L.life / 12})`; ctx.fillRect(L.x, L.y - w / 2, W, w);
      ctx.fillStyle = '#fff'; ctx.fillRect(L.x, L.y - w / 6, W, w / 3);
    }
    for (const b of eBullets) {
      ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r / 2, 0, Math.PI * 2); ctx.fill();
    }
    if (state === 'play') drawPlayer();
  }
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 10); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'title') {
    ctx.fillStyle = 'rgba(10,4,20,0.45)'; ctx.fillRect(0, 0, W, H);
    center('NIGHT WING', 120, 52, '#7df9ff');
    center('나이트 윙', 158, 22, '#ffe5d0');
    center('방향키/WASD 이동 · 자동 발사', 230, 17, '#e6d6f0');
    center('Space 꾹 눌렀다 떼기 → 관통 레이저 · P 일시정지', 258, 17, '#e6d6f0');
    center('모바일: 드래그 이동, 손가락 떼면 레이저', 286, 17, '#e6d6f0');
    if (Math.floor(frame / 15) % 2) center('Enter / 클릭으로 시작', 350, 22, '#ffd36e');
    center('M / ESC : 메뉴로', 400, 15, '#bba');
  } else if (state === 'play') {
    hud();
    if (stageMsg > 0) center('STAGE ' + stage, H / 2, 40, `rgba(255,211,110,${Math.min(1, stageMsg / 30)})`);
    if (enemies.some(e => e.boss && e.x > W - 150)) center('⚠ WARNING ⚠', H / 2 - 60, 36, '#ef476f');
    if (paused) center('일시정지', H / 2, 40);
  } else {
    hud();
    ctx.fillStyle = 'rgba(10,4,20,0.5)'; ctx.fillRect(0, 0, W, H);
    center('GAME OVER', H / 2 - 40, 48, '#ef476f');
    center('점수 ' + score.toLocaleString(), H / 2 + 6, 24);
    if (score >= best && score > 0) center('🏆 신기록!', H / 2 + 40, 20, '#ffd36e');
    if (Math.floor(frame / 15) % 2) center('Enter / 클릭으로 다시 시작', H / 2 + 90, 20, '#ffd36e');
    center('M / ESC : 메뉴로', H / 2 + 125, 15, '#bba');
  }
}

// 초당 30번 고정 업데이트 (모니터 주사율 무관)
const STEP = 1000 / 30;
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(250, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
